apply plugin: 'com.android.library'

android {
    namespace 'com.xiaoniu.finance.myfixed'
    compileSdk 34
    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [moduleName: 'Fixed', libPackageName: 'com.xiaoniu.finance.myfixed']
            }
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            postprocessing {
                removeUnusedCode false
                removeUnusedResources false
                obfuscate false
                optimizeCode false
                proguardFile 'proguard-rules.pro'
            }
        }
    }

}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

//    implementation project(':XNAnnotation')
//    annotationProcessor project(':XNProcessor')
//    implementation project(':XNRouter')
    implementation 'com.xiaoniu.corelib:xnannotation:1.0.0'
    annotationProcessor 'com.xiaoniu.corelib:xnprocessor:1.0.0'
    implementation 'com.xiaoniu.corelib:xnrouter:1.0.0'

    implementation 'com.android.support:support-v4:23.4.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.0'
    implementation 'com.android.support:appcompat-v7:23.4.0'
}

